version: '3.8'

services:
  postgres:
    image: postgres
    container_name: my-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: my-redis-cache
    restart: always
    ports:
      - '${REDIS_PORT}:6379'

volumes:
  postgres_data:
